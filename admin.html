<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#DCE987">
<title>EYES ON JESUS · 출석 관리</title>
<style>
:root{--lime:#DCE987;--coral:#F6A29A;--blue:#2457E6;--ink:#222;--muted:#70736c;--line:rgba(34,34,34,.12);--paper:#fffaf7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--lime);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",sans-serif}
.wrap{width:min(1180px,100%);margin:auto;padding:28px 16px 48px}
header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:22px}
h1{margin:0;color:var(--coral);font-size:clamp(34px,6vw,54px);line-height:.95;font-weight:900;letter-spacing:-.055em}
.subtitle{margin-top:10px;color:#506667;font-weight:600}
.card{background:rgba(255,250,247,.97);border:1px solid rgba(255,255,255,.6);border-radius:18px;box-shadow:0 14px 36px rgba(65,75,22,.08);padding:20px}
#loginCard{max-width:430px;margin:70px auto}
h2{margin:0 0 18px;color:var(--blue);font-size:25px;letter-spacing:-.035em}
label{display:block;margin:14px 0 6px;font-size:13px;font-weight:700;color:#555}
input,select,button{font:inherit}
input,select{width:100%;height:46px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
button{min-height:44px;padding:0 16px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}
button.secondary{background:#6a6d67}
button:disabled{opacity:.5;cursor:wait}
.message{min-height:22px;margin-top:12px;color:#a24141;font-size:13px}
.toolbar{display:grid;grid-template-columns:1.2fr .7fr .8fr auto auto;gap:10px;align-items:end}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.stat{padding:16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.stat b{display:block;color:var(--blue);font-size:25px}.stat span{font-size:12px;color:var(--muted)}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{width:100%;border-collapse:collapse;white-space:nowrap}
th,td{padding:12px 11px;border-bottom:1px solid var(--line);text-align:center;font-size:13px}
th{position:sticky;top:0;background:#f6f7e8;color:#50582b;font-weight:800}
td.name{text-align:left;font-weight:700}
.yes{color:#14753b;font-weight:800}.no{color:#999}
.empty{padding:40px;text-align:center;color:var(--muted)}
.top-actions{display:flex;gap:8px}
#dashboard{display:none}
@media(max-width:760px){
 header{align-items:start;flex-direction:column}.toolbar{grid-template-columns:1fr 1fr}.toolbar .wide{grid-column:1/-1}
 .stats{grid-template-columns:1fr 1fr}.card{padding:15px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>EYES ON JESUS</h1><div class="subtitle">출석 관리</div></div>
  <div id="topActions" class="top-actions" style="display:none"><button id="logoutBtn" class="secondary">로그아웃</button></div>
</header>

<section id="loginCard" class="card">
  <h2>관리자 로그인</h2>
  <label for="email">이메일</label>
  <input id="email" type="email" autocomplete="username" placeholder="관리자 이메일">
  <label for="password">비밀번호</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="비밀번호">
  <button id="loginBtn" style="width:100%;margin-top:18px">로그인</button>
  <div id="loginMessage" class="message"></div>
</section>

<section id="dashboard">
  <div class="card">
    <div class="toolbar">
      <div class="wide"><label for="dateFilter">날짜</label><input id="dateFilter" type="date"></div>
      <div><label for="gradeFilter">학년</label><select id="gradeFilter"><option value="">전체</option><option value="1">중1</option><option value="2">중2</option><option value="3">중3</option></select></div>
      <div><label for="classFilter">반</label><select id="classFilter"><option value="">전체</option></select></div>
      <button id="loadBtn">조회</button>
      <button id="csvBtn" class="secondary">CSV 다운로드</button>
    </div>

    <div class="stats">
      <div class="stat"><b id="totalCount">0</b><span>체크인</span></div>
      <div class="stat"><b id="beforeCount">0</b><span>9시 전</span></div>
      <div class="stat"><b id="prizeCount">0</b><span>뽑기 대상</span></div>
      <div class="stat"><b id="bibleCount">0</b><span>성경책 지참</span></div>
    </div>

    <div class="table-wrap">
      <table>
        <thead><tr><th>시간</th><th>학년</th><th>반</th><th>이름</th><th>9시 전</th><th>뽑기</th><th>성경책</th><th>PHONE DOWN</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty">조회 버튼을 눌러주세요.</div>
    </div>
    <div id="dataMessage" class="message"></div>
  </div>
</section>
</div>

<script>
const SUPABASE_URL="https://itxzyskaytnuclwqnnax.supabase.co";
const SUPABASE_KEY="sb_publishable_btcXpBgbzpJoOEg27Ti5bA_mbLN_rGY";
const classes={"1":["1-1","1-2","1-3","1-4","1-5"],"2":["2-1","2-2","2-3","2-4","2-5","2-6","2-7"],"3":["3-1","3-2","3-3","3-4","3-5","3-6"]};
let token=sessionStorage.getItem("eoj-admin-token")||"";
let currentRows=[];

const $=id=>document.getElementById(id);
function todayKorea(){return new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul"}).format(new Date())}
function setLoggedIn(ok){$("loginCard").style.display=ok?"none":"block";$("dashboard").style.display=ok?"block":"none";$("topActions").style.display=ok?"flex":"none"}
function mark(value){return value?'<span class="yes">✓</span>':'<span class="no">—</span>'}
function safe(value){const el=document.createElement("span");el.textContent=String(value??"");return el.innerHTML}

async function login(){
  $("loginBtn").disabled=true;$("loginMessage").textContent="";
  try{
    const response=await fetch(SUPABASE_URL+"/auth/v1/token?grant_type=password",{
      method:"POST",headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body:JSON.stringify({email:$("email").value.trim(),password:$("password").value})
    });
    const data=await response.json();
    if(!response.ok)throw new Error("이메일 또는 비밀번호를 확인해 주세요.");
    token=data.access_token;sessionStorage.setItem("eoj-admin-token",token);
    setLoggedIn(true);await loadAttendance();
  }catch(e){$("loginMessage").textContent=e.message}
  finally{$("loginBtn").disabled=false}
}

async function loadAttendance(){
  $("loadBtn").disabled=true;$("dataMessage").textContent="";
  try{
    const params={
      p_date:$("dateFilter").value||null,
      p_grade:$("gradeFilter").value?Number($("gradeFilter").value):null,
      p_class_name:$("classFilter").value||null
    };
    const response=await fetch(SUPABASE_URL+"/rest/v1/rpc/get_attendance_report",{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+token,"Content-Type":"application/json"},
      body:JSON.stringify(params)
    });
    if(response.status===401){logout();throw new Error("로그인이 만료되었습니다. 다시 로그인해 주세요.")}
    const data=await response.json();
    if(!response.ok)throw new Error(data.message||"출석 기록을 불러오지 못했습니다.");
    currentRows=data;
    $("rows").innerHTML=data.map(r=>'<tr><td>'+safe(r.checkin_time)+'</td><td>'+safe(r.grade)+'</td><td>'+safe(r.class_name)+'</td><td class="name">'+safe(r.student_name)+'</td><td>'+mark(r.before_9)+'</td><td>'+mark(r.prize)+'</td><td>'+mark(r.bible)+'</td><td>'+mark(r.phone)+'</td></tr>').join("");
    $("empty").style.display=data.length?"none":"block";
    $("empty").textContent="해당 조건의 체크인 기록이 없습니다.";
    $("totalCount").textContent=data.length;
    $("beforeCount").textContent=data.filter(r=>r.before_9).length;
    $("prizeCount").textContent=data.filter(r=>r.prize).length;
    $("bibleCount").textContent=data.filter(r=>r.bible).length;
  }catch(e){$("dataMessage").textContent=e.message}
  finally{$("loadBtn").disabled=false}
}

function logout(){token="";sessionStorage.removeItem("eoj-admin-token");setLoggedIn(false)}
function updateClasses(){
  $("classFilter").innerHTML='<option value="">전체</option>';
  (classes[$("gradeFilter").value]||[]).forEach(c=>$("classFilter").add(new Option(c,c)));
}
function downloadCsv(){
  if(!currentRows.length)return alert("다운로드할 기록이 없습니다.");
  const header=["날짜","시간","학년","반","이름","9시 전","뽑기","성경책","PHONE DOWN"];
  const values=currentRows.map(r=>[r.checkin_date,r.checkin_time,r.grade,r.class_name,r.student_name,r.before_9?"Y":"N",r.prize?"Y":"N",r.bible?"Y":"N",r.phone?"Y":"N"]);
  const csv=[header,...values].map(row=>row.map(v=>'"'+String(v??"").replaceAll('"','""')+'"').join(",")).join("\r\n");
  const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="eyes-on-jesus-"+$("dateFilter").value+".csv";a.click();URL.revokeObjectURL(a.href);
}

$("dateFilter").value=todayKorea();
$("loginBtn").addEventListener("click",login);
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")login()});
$("logoutBtn").addEventListener("click",logout);
$("gradeFilter").addEventListener("change",updateClasses);
$("loadBtn").addEventListener("click",loadAttendance);
$("csvBtn").addEventListener("click",downloadCsv);
if(token){setLoggedIn(true);loadAttendance()}else setLoggedIn(false);
</script>
</body>
</html>
